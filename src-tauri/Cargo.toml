[package]
name = "danmu-tools"
version = "1.2.1"
description = "弹幕漏读工具"
authors = ["小小鱼"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "danmu_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[package.metadata.tauri-winres]
CompanyName = "小小鱼（QQ：521573）"
FileDescription = "弹幕漏读工具"
FileVersion = "1.2.1"
ProductVersion = "1.2.1"
ProductName = "DanmuTools"
InternalName = "DanmuTools"
OriginalFilename = "DanmuTools.exe"
LegalCopyright = "莫要用于任何商业或违法用途。否则造成的一切后果自负。与作者(鱼刺)和逆向思维工作室无关。"
Author = "小小鱼"

[dependencies]
anyhow = "1"
brotli = "8"
directories = "5"
flate2 = "1"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["macros", "time"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
url = "2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
